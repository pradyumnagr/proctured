<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExamBit | Student Result</title>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            color: #202124;
            margin: 0;
            padding: 24px 14px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 460px;
            padding: 28px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }
        .card.wide { max-width: 680px; }
        h1 {
            margin: 0 0 6px;
            font-size: 20px;
            color: #1a73e8;
            text-align: center;
        }
        .subtitle {
            margin: 0 0 22px;
            font-size: 13px;
            color: #5f6368;
            text-align: center;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #3c4043;
        }
        input {
            width: 100%;
            padding: 11px 12px;
            margin-bottom: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        input:focus { border-color: #1a73e8; }
        .captcha-box {
            display: flex;
            justify-content: center;
            margin: 12px 0 18px;
        }
        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #1a73e8;
            color: #ffffff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }
        button:hover:not(:disabled) { background: #1557b0; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-outline {
            background: #ffffff;
            color: #3c4043;
            border: 1px solid #cbd5e1;
        }
        .btn-outline:hover { background: #f1f5f9; }
        .error {
            display: none;
            margin-top: 12px;
            color: #d93025;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }
        .meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 14px;
            margin-bottom: 18px;
            font-size: 13px;
        }
        .meta span { display: block; color: #64748b; font-size: 11px; text-transform: uppercase; }
        .meta strong { font-size: 14px; color: #0f172a; }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            margin-bottom: 16px;
        }
        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid #e2e8f0;
            text-align: left;
        }
        th { background: #f8fafc; color: #475569; font-size: 12px; text-transform: uppercase; }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 700;
        }
        .pass { background: #e6f4ea; color: #1e8e3e; }
        .fail { background: #fce8e6; color: #d93025; }
        .absent { background: #fef7e0; color: #b07d00; }
        .remark {
            background: #f0f6ff;
            border-left: 4px solid #1a73e8;
            border-radius: 6px;
            padding: 12px 14px;
            margin-bottom: 14px;
            font-size: 13.5px;
            line-height: 1.5;
        }
        .remark strong { display: block; color: #1a73e8; margin-bottom: 4px; font-size: 12px; }
        .actions { display: flex; gap: 10px; margin-top: 18px; }
        .hidden { display: none; }

        @media (max-width: 500px) {
            .meta { grid-template-columns: 1fr; }
        }
        @media print {
            body { background: #fff; padding: 0; align-items: flex-start; }
            .card { box-shadow: none; border: none; max-width: 100%; }
            .actions { display: none; }
        }
    </style>
</head>
<body>

    <!-- Lookup Screen -->
    <div id="lookup-view" class="card">
        <h1>ExamBit Results</h1>
        <p class="subtitle">Kashi Institute of Technology, Varanasi</p>

        <form id="result-form" novalidate>
            <label for="roll">Roll Number</label>
            <input type="text" id="roll" placeholder="Enter 13-digit Roll Number" maxlength="15" autocomplete="off" required>

            <label for="dob">Date of Birth</label>
            <input type="text" id="dob" placeholder="DD/MM/YYYY" maxlength="10" autocomplete="off" required>

            <div class="captcha-box">
                <div class="g-recaptcha" data-sitekey="6Leofe4tAAAAAID1p1Me1NtLrEjhMQJ9QUKYq1Bg"></div>
            </div>

            <button type="submit" id="submit-btn">View Result</button>
            <div id="error-msg" class="error"></div>
        </form>
    </div>

    <!-- Result Screen -->
    <div id="result-view" class="card wide hidden">
        <h1>Statement of Marks</h1>
        <p class="subtitle" id="exam-heading">ExamBit Official Result</p>

        <div class="meta">
            <div><span>Student Name</span><strong id="st-name">-</strong></div>
            <div><span>Roll Number</span><strong id="st-roll">-</strong></div>
            <div><span>Course / Branch</span><strong id="st-branch">-</strong></div>
            <div><span>Year / Section</span><strong id="st-sec">-</strong></div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Subject</th>
                    <th>Marks</th>
                    <th>%</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="marks-body"></tbody>
        </table>

        <div id="remarks-box"></div>

        <div class="actions">
            <button type="button" class="btn-outline" id="back-btn">Check Another</button>
            <button type="button" onclick="window.print()">Print / Save PDF</button>
        </div>
    </div>

    <script>
        (function () {
            const SUPABASE_URL = "https://xvxrqyalzmldkorgtqhi.supabase.co/rest/v1";
            const SUPABASE_KEY = "sb_publishable_5R6XZ1enV3PJfk3Ju4vDVw_w25oPsJh";

            const form = document.getElementById("result-form");
            const rollInput = document.getElementById("roll");
            const dobInput = document.getElementById("dob");
            const submitBtn = document.getElementById("submit-btn");
            const errorMsg = document.getElementById("error-msg");
            const lookupView = document.getElementById("lookup-view");
            const resultView = document.getElementById("result-view");

            // Auto-format DD/MM/YYYY
            dobInput.addEventListener("input", function () {
                let v = this.value.replace(/\D/g, "");
                if (v.length > 2 && v.length <= 4) v = v.slice(0, 2) + "/" + v.slice(2);
                else if (v.length > 4) v = v.slice(0, 2) + "/" + v.slice(2, 4) + "/" + v.slice(4, 8);
                this.value = v;
            });

            rollInput.addEventListener("input", function () {
                this.value = this.value.replace(/[^a-zA-Z0-9]/g, "").toUpperCase();
            });

            function escapeHtml(text) {
                return String(text ?? "").replace(/[&<>"']/g, (c) => ({
                    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
                }[c]));
            }

            function showError(msg) {
                errorMsg.textContent = msg;
                errorMsg.style.display = "block";
            }

            function getRemark(name, r) {
                if (r.ai_remark && r.ai_remark.trim()) return r.ai_remark.trim();

                const first = (name || "Student").split(" ")[0];
                const subj = r.subject_name || "this subject";
                const max = Number(r.max_marks) || 70;
                const pass = Number(r.pass_marks) || 21;

                if (r.attendance_status === "ABSENT" || r.marks_obtained === null) {
                    return `${first}, you were absent for ${subj}. Please contact your subject faculty regarding preparation before university exams.`;
                }
                const m = Number(r.marks_obtained);
                const pct = (m / max) * 100;

                if (pct >= 80) return `Excellent performance, ${first}! Your score of ${m}/${max} in ${subj} reflects strong conceptual mastery. Keep practicing timed papers to maintain distinction.`;
                if (pct >= 60) return `Good work, ${first}. Scoring ${m}/${max} in ${subj} shows a solid foundation. Sharpening code examples and diagrams will help you cross 80%.`;
                if (m >= pass) return `You passed ${subj} with ${m}/${max}, ${first}. Focus on revising high-weightage long questions to build a wider safety margin for the final exam.`;
                if (pass - m <= 3) return `${first}, you missed passing ${subj} by just ${pass - m} mark(s) (${m}/${max}). A targeted review of core definitions and previous-year questions will easily bridge this gap.`;
                return `${first}, your score of ${m}/${max} in ${subj} highlights key syllabus gaps. Prioritize foundational topics and meet your faculty for a doubt-clearing session.`;
            }

            form.addEventListener("submit", async (e) => {
                e.preventDefault();
                errorMsg.style.display = "none";

                const roll = rollInput.value.trim();
                const dob = dobInput.value.trim();
                const captcha = typeof grecaptcha !== "undefined" ? grecaptcha.getResponse() : "";

                if (roll.length < 5) return showError("Enter a valid Roll Number.");
                if (!/^\d{2}\/\d{2}\/\d{4}$/.test(dob)) return showError("Enter DOB in DD/MM/YYYY format.");
                if (!captcha) return showError("Please complete the CAPTCHA.");

                submitBtn.disabled = true;
                submitBtn.textContent = "Checking...";

                try {
                    const res = await fetch(`${SUPABASE_URL}/rpc/get_student_results`, {
                        method: "POST",
                        headers: {
                            "apikey": SUPABASE_KEY,
                            "Authorization": `Bearer ${SUPABASE_KEY}`,
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({ p_roll_no: roll, p_dob: dob })
                    });

                    if (!res.ok) throw new Error("Unable to connect to the result server.");
                    const data = await res.json();

                    if (!data || !data.ok) {
                        showError(data?.error || "Invalid Roll Number or Date of Birth.");
                        if (typeof grecaptcha !== "undefined") grecaptcha.reset();
                        return;
                    }

                    renderResult(data.student, data.results || []);
                } catch (err) {
                    showError(err.message || "Network error. Try again.");
                    if (typeof grecaptcha !== "undefined") grecaptcha.reset();
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "View Result";
                }
            });

            function renderResult(student, results) {
                document.getElementById("st-name").textContent = student.name || "-";
                document.getElementById("st-roll").textContent = student.roll_no || "-";
                document.getElementById("st-branch").textContent = [student.course, student.branch].filter(Boolean).join(" - ") || "-";
                document.getElementById("st-sec").textContent = [student.year ? `Year ${student.year}` : "", student.section ? `Sec ${student.section}` : ""].filter(Boolean).join(" / ") || "-";

                const tbody = document.getElementById("marks-body");
                const remarksBox = document.getElementById("remarks-box");

                if (results.length === 0) {
                    document.getElementById("exam-heading").textContent = "No Results Published Yet";
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;color:#64748b;">No exam marks found for your roll number.</td></tr>`;
                    remarksBox.innerHTML = "";
                } else {
                    document.getElementById("exam-heading").textContent = results[0].exam_name || "Official Result";

                    tbody.innerHTML = results.map((r) => {
                        const isAbsent = r.attendance_status === "ABSENT" || r.marks_obtained === null;
                        const max = Number(r.max_marks) || 70;
                        const pass = Number(r.pass_marks) || 21;
                        const marks = isAbsent ? "AB" : `${r.marks_obtained} / ${max}`;
                        const pct = isAbsent ? "-" : `${((Number(r.marks_obtained) / max) * 100).toFixed(1)}%`;
                        const badge = isAbsent
                            ? `<span class="badge absent">ABSENT</span>`
                            : (Number(r.marks_obtained) >= pass
                                ? `<span class="badge pass">PASS</span>`
                                : `<span class="badge fail">FAIL</span>`);

                        return `<tr>
                            <td><strong>${escapeHtml(r.subject_name)}</strong> <small style="color:#64748b">(${escapeHtml(r.subject_code)})</small></td>
                            <td>${marks}</td>
                            <td>${pct}</td>
                            <td>${badge}</td>
                        </tr>`;
                    }).join("");

                    remarksBox.innerHTML = results.map((r) => `
                        <div class="remark">
                            <strong>AI Remark &mdash; ${escapeHtml(r.subject_name)}</strong>
                            ${escapeHtml(getRemark(student.name, r))}
                        </div>
                    `).join("");
                }

                lookupView.classList.add("hidden");
                resultView.classList.remove("hidden");
            }

            document.getElementById("back-btn").addEventListener("click", () => {
                resultView.classList.add("hidden");
                lookupView.classList.remove("hidden");
                form.reset();
                errorMsg.style.display = "none";
                if (typeof grecaptcha !== "undefined") grecaptcha.reset();
            });
        })();
    </script>
</body>
</html>
